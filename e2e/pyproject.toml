[project]
name = "tideo-e2e"
version = "0.1.0"
description = "Real-device E2E suite for Tideo Auto Brightness"
requires-python = ">=3.12"
dependencies = [
  "adbutils==2.12.0",
  "uiautomator2==3.7.0",
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "device: needs the phone through the host adb server",
  "smoke: the S6 smoke set",
  "scenario(id): a device scenario, by its scenarios.toml row id",
]
addopts = "-ra --strict-markers"
