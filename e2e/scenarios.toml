# One row per DEVICE_TEST_SCRIPT step (id = s<section>_<step>), plus `extra` rows for checks that
# are not a script step. test_manifest.py keeps this in lockstep with the script.
#
# status:  auto | partial | manual
# effects: what the scenario may write, directly or through Tideo (vocabulary in
#          tideo_e2e/scenarios.py; refined into the S3 effect inventory). Required unless manual.
# test:    pytest node id. Required for auto rows unless `pending = true` (scenario not written yet).
# reason:  why a row is partial or manual. Required for both.

