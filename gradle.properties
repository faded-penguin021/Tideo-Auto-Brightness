org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# D-161 backlog U4: decoupled 3-module build → parallel task execution; the configuration cache
# speeds the repeated ladder invocations a maintenance session makes. Measured timings: STATE.md
# Changelog 2026-07-10. CI passes --no-configuration-cache as a pure cost skip — a single
# invocation only pays the store cost. (The PR #91 hang once blamed on the store was a test's
# unbounded `su` read, DA-017 — see build.yml's ladder step comment.)
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
