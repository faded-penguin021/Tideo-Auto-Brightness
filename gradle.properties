org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# D-161 backlog U4: decoupled 3-module build → parallel task execution; the configuration cache
# speeds the repeated ladder invocations a maintenance session makes (CI's single invocation
# only pays a small one-time store). Measured timings: STATE.md Changelog 2026-07-10.
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
