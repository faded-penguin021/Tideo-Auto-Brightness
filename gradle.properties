org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# D-161 backlog U4: decoupled 3-module build → parallel task execution; the configuration cache
# speeds the repeated ladder invocations a maintenance session makes. Measured timings: STATE.md
# Changelog 2026-07-10. CI passes --no-configuration-cache: the one-time store hung under the
# single-use --no-daemon daemon (PR #91 2026-07-24 — see build.yml's ladder step comment).
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
