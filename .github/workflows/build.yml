name: Build

# Secret-free validation: the full acceptance ladder (all module tests + lint + the debug APK) on every
# pull request and on pushes to main. release-signing.yml handles the SIGNED release artifact on main;
# this one needs no secrets, so it gates PRs from any branch.
#
# Node 24 runtime policy (all workflows): GitHub deprecated the Node 20 action runtime — runners default
# to Node 24 from 2026-06-16 and remove Node 20 on 2026-09-16. Every action used across these workflows is
# a major that declares `runs.using: node24` (checkout@v5, setup-java@v5, setup-android@v4, cache@v5,
# upload-artifact@v6, download-artifact@v7, wrapper-validation@v6; codeql-action@v4, github-script@v8,
# action-gh-release@v3 in the sibling workflows). Do NOT downgrade any of these to a Node 20 major — it
# reintroduces the deprecation warning and will hard-break after 2026-09-16.
#
# Actions are pinned to commit SHAs with the resolved version in a trailing comment (DB-038). The comment
# is the readable half of the pin, not decoration: keep the two in sync. Dependabot maintains both — see
# .github/dependabot.yml for why github-actions gets version updates while gradle does not.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # cap a hung Gradle daemon / SDK fetch (GitHub's default is 360)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + all branches (cheap on this repo) so origin/main resolves. Two ladder
          # rungs diff against it — the poison-token scan (D-115) and the author-identity check —
          # and both degrade to "checked NOTHING" without it, loudly but harmlessly. The default
          # depth-1 single-ref checkout is what causes that. The local-only advisories self-skip
          # under CI by design.
          fetch-depth: 0

      # gradle/wrapper/gradle-wrapper.jar is a tracked binary by necessity — gradlew, every CI job
      # and the F-Droid toolchain all need it, so "don't commit binaries" is not available to us.
      # This is the control that stands in for it: the jar is checked against Gradle's published
      # checksums before anything executes it. It runs in EVERY workflow that invokes the wrapper
      # (codeql, release, release-signing, fdroid-compat's native job), not just this one —
      # validating only the ordinary build runner would leave the release path, which is what
      # actually ships an APK, unprotected. Must stay after checkout and before the first Gradle
      # invocation; here that is scripts/ladder.sh → verify.sh → ./gradlew.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      # Runs the shipped guards' own fixture suite BEFORE the ladder, and deliberately so: the
      # ladder exits on the first guard failure without reaching scripts/verify.sh, where this
      # suite otherwise lives. Without this step a red guard tells you nothing about whether the
      # guards themselves regressed — which is the case you most want distinguished. Seconds of
      # pure shell against sandbox fixture repos, so it also fails fast, before toolchain setup.
      - name: Guard fixture suites
        run: |
          bash scripts/test-ladder-guards.sh
          bash scripts/tests/local-guards.sh

      # JDK 21: Robolectric 4.16+ requires it to run tests under SDK 36 (Android 16 / targetSdk 36).
      # The app still compiles to 17 bytecode (sourceCompatibility/jvmTarget = 17) — this is only the
      # JDK that runs Gradle + the test JVM.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          # Skip the default `tools platform-tools` install: the obsolete `tools` package drags in the
          # Android Emulator (a large, flaky download — it failed CI with "Error on ZipFile unknown
          # archive"). This job runs only unit tests + lint + assembleDebug, so it needs no emulator;
          # cmdline-tools + accepted licenses are still set up, and AGP fetches the compile SDK /
          # build-tools on demand (the runner image already ships them).
          packages: ''

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # ~/.robolectric: the android-all jars Robolectric fetches at TEST RUNTIME live outside
          # ~/.gradle, so without this line every run re-downloads them from Maven Central.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.robolectric
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # The acceptance ladder, invoked through the same script the local session runs, so CI and
      # local share ONE definition of "verified" rather than a hand-maintained copy (D-166).
      # The ladder runs its guards (working-memory band and structure, ledger rollover, citation
      # integrity, secret shapes, poison tokens, author identity, shipped-script integrity, the
      # rail self-tests and this repo's guards under scripts/guards/) and then scripts/verify.sh:
      # the two fixture suites, then domain + platform + app tests, lint and the debug APK.
      #
      # No Gradle flags here any more: the shipped ladder takes no pass-through arguments, so
      # scripts/verify.sh adds --no-daemon --no-configuration-cache itself when CI is set. The
      # local-only advisories self-skip under CI.
      - name: Acceptance ladder (scripts/ladder.sh)
        timeout-minutes: 20
        run: scripts/ladder.sh

      # If the ladder step fails or times out, dump every live JVM's threads so a hang names its
      # culprit (stuck test, worker teardown, daemon stop) instead of burning the cap silently.
      - name: Thread-dump surviving JVMs (hang diagnosis)
        if: failure() || cancelled()
        run: |
          for p in $(pgrep java || true); do
            echo "=== jstack $p ($(ps -o args= -p "$p" | cut -c1-120)) ==="
            jstack "$p" || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
